{% extends "base.html" %}
{% block content %}
<div class="login-page">
  <div class="login-box">
    <h1>Вхід</h1>
    <p class="hero-sub" style="margin-bottom: 18px;">Цей сайт приватний — увійдіть, щоб продовжити.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/site-login" class="card login-form">
      <label>Логін
        <input type="text" name="username" required autofocus autocomplete="username">
      </label>
      <label>Пароль
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
