{% extends "base.html" %}
{% block content %}
<div class="hero">
  <div class="hero-title-row">
    <a href="/" class="back-link" title="Усі інструменти" aria-label="Усі інструменти"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
    <h1>Редактор метаданих</h1>
  </div>
  <p class="hero-sub">Завантаж будь-який файл (зображення, відео, аудіо, PDF, документи) — покажемо всі приховані метадані та зробимо чисту копію без них.</p>
</div>

<form id="metadata-form" class="card">
  <label>Файл
    <div class="file-input-row">
      <div class="file-drop-zone" id="file-drop-zone" role="button" tabindex="0" aria-label="Обрати файл">
        <span class="file-drop-text" id="file-drop-text">Натисніть щоб завантажити або перетягніть сюди</span>
        <button type="button" class="file-clear-btn" id="file-clear-btn" hidden title="Видалити файл" aria-label="Видалити файл"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <button type="submit" class="btn-primary">Прочитати метадані</button>
      <input type="file" name="file" id="file-input" required hidden>
    </div>
    <span class="hint">Максимальний розмір файлу: {{ max_upload_mb }} МБ.</span>
  </label>
</form>

<div id="status-box"></div>
<div id="result-box"></div>
{% endblock %}
{% block scripts %}
<script src="/static/metadata.js"></script>
{% endblock %}
